; Profanity Censor user settings template.
; The application creates the live settings.ini in its per-user application-data directory.
; Do not commit that generated file: it contains machine-specific paths.

[settings]
schema_version = 1

[directories]
; Use absolute paths. The generated settings.ini contains this computer's defaults.
input = C:\Users\YourName\Documents\Profanity Censor\Ready
output = C:\Users\YourName\Documents\Profanity Censor\Finished
archive = C:\Users\YourName\Documents\Profanity Censor\Processed
transcripts = C:\Users\YourName\Documents\Profanity Censor\Transcripts

[processing]
mode = censor
device = auto

[censoring]
stereo_method = drop_audio
padding_before_ms = 100
padding_after_ms = 100

[audio]
surround_output = preserve_5_1

[video]
mode = h264

[whisper]
library = faster-whisper
model = large-v3

[source]
archive_after_success = false
scan_subdirectories = true

[runtime]
ffmpeg_path =
ffprobe_path =
whisper_cache =
