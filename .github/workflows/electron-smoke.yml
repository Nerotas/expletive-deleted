name: Electron Smoke

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: electron-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke test
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build and smoke-test Electron
        working-directory: frontend
        run: npm run smoke

      - name: Build setup-first Windows package
        working-directory: frontend
        run: npm run package:dir

      - name: Smoke-test setup-first packaged application
        working-directory: frontend
        run: npm run smoke:package

      - name: Upload smoke-test screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: electron-smoke-screenshots
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7