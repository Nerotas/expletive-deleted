name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt coverage

      - name: Test with coverage
        run: python -m coverage run --source=backend,scripts -m unittest discover -s tests

      - name: Report coverage
        run: python -m coverage report -m

      - name: Require native Windows containment and publication gates
        run: python -m unittest tests.test_filesystem_paths tests.test_windows_destination_guards tests.test_publication tests.test_output_access

      - name: Require dictionary transaction and recovery gates
        run: python -m unittest tests.test_policy_transactions

      - name: Require shared settings and component conflict gates
        run: python -m unittest tests.test_settings_transactions tests.test_installation_conflicts tests.test_desktop_bridge tests.test_manage_settings

      - name: Require setup control responsiveness and approval ownership
        run: python -m unittest tests.test_setup_control tests.test_installation_conflicts tests.test_settings_transactions
