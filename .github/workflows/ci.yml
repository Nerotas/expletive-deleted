name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Backend and desktop
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      HF_HUB_OFFLINE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Test backend
        run: python -m unittest discover -s tests

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Type-check frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build and smoke-test Electron
        working-directory: frontend
        run: npm run smoke

      - name: Build Windows installer
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        working-directory: frontend
        run: npm run package:win

      - name: Smoke-test packaged application
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: frontend
        run: npm run smoke:package

      - name: Upload Windows installer
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: expletive-deleted-windows-x64
          path: frontend/release/Expletive-Deleted-Setup-*-x64.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload smoke-test screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: electron-smoke-screenshots
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7