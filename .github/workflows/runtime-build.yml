name: Build audited Windows runtime

on:
  workflow_dispatch:
    inputs:
      runtime_version:
        description: Version label for the audited runtime payload
        required: true
        type: string
      runtime_payload_url:
        description: HTTPS URL of the reviewed runtime payload ZIP
        required: true
        type: string
      runtime_payload_sha256:
        description: SHA-256 of the reviewed runtime payload ZIP
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  audit-runtime:
    name: Audit Windows runtime ${{ inputs.runtime_version }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Download and verify reviewed runtime payload
        id: payload
        shell: pwsh
        env:
          RUNTIME_PAYLOAD_URL: ${{ inputs.runtime_payload_url }}
          RUNTIME_PAYLOAD_SHA256: ${{ inputs.runtime_payload_sha256 }}
        run: |
          if ($env:RUNTIME_PAYLOAD_URL -notmatch '^https://') {
            throw 'runtime_payload_url must be an HTTPS URL.'
          }
          if ($env:RUNTIME_PAYLOAD_SHA256 -notmatch '^[0-9a-fA-F]{64}$') {
            throw 'runtime_payload_sha256 must be a 64-character SHA-256 value.'
          }
          $archive = Join-Path $env:RUNNER_TEMP 'reviewed-runtime.zip'
          $extractRoot = Join-Path $env:RUNNER_TEMP 'reviewed-runtime'
          Invoke-WebRequest -Uri $env:RUNTIME_PAYLOAD_URL -OutFile $archive
          $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          if ($actualHash -ine $env:RUNTIME_PAYLOAD_SHA256) {
            throw "Runtime payload checksum mismatch. Expected $($env:RUNTIME_PAYLOAD_SHA256), got $actualHash."
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $extractRoot -Force
          $payload = Get-ChildItem -LiteralPath $extractRoot -Directory | Select-Object -First 1
          if (-not $payload) { $payload = Get-Item -LiteralPath $extractRoot }
          "BUNDLED_RUNTIME_DIR=$($payload.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "payload=$($payload.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Generate final runtime manifest
        working-directory: frontend
        shell: pwsh
        env:
          BUNDLED_RUNTIME_DIR: ${{ steps.payload.outputs.payload }}
        run: node scripts/generate-bundled-runtime-manifest.mjs "$env:BUNDLED_RUNTIME_DIR"

      - name: Audit runtime payload
        working-directory: frontend
        shell: pwsh
        env:
          BUNDLED_RUNTIME_DIR: ${{ steps.payload.outputs.payload }}
        run: npm run audit:bundled-runtime -- "$env:BUNDLED_RUNTIME_DIR"

      - name: Verify runtime executables and Python imports
        working-directory: frontend
        shell: pwsh
        env:
          BUNDLED_RUNTIME_DIR: ${{ steps.payload.outputs.payload }}
        run: npm run verify:bundled-runtime -- "$env:BUNDLED_RUNTIME_DIR"

      - name: Package audited runtime archive
        id: archive
        shell: pwsh
        env:
          PAYLOAD: ${{ steps.payload.outputs.payload }}
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "expletive-deleted-runtime-${{ inputs.runtime_version }}.zip"
          Compress-Archive -Path (Join-Path $env:PAYLOAD '*') -DestinationPath $archive -CompressionLevel Optimal -Force
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $metadata = [ordered]@{
            runtime_version = '${{ inputs.runtime_version }}'
            archive_sha256 = $hash
            archive_name = [IO.Path]::GetFileName($archive)
          } | ConvertTo-Json
          $metadataPath = Join-Path $env:RUNNER_TEMP 'runtime-bundle.json'
          $metadata | Set-Content -LiteralPath $metadataPath -Encoding utf8
          "archive=$archive" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "metadata=$metadataPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host $metadata

      - name: Upload audited runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: expletive-deleted-runtime-${{ inputs.runtime_version }}
          path: |
            ${{ steps.archive.outputs.archive }}
            ${{ steps.archive.outputs.metadata }}
          if-no-files-found: error
          retention-days: 30
