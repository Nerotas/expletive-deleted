name: Release

on:
  pull_request:
    branches: [main]
    types: [closed]
    paths-ignore:
      - "docs/**"
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment for a manual release
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - none

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Version, validate, and publish
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      HF_HUB_OFFLINE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Choose release version
        id: version
        shell: pwsh
        env:
          MANUAL_BUMP: ${{ inputs.bump }}
        run: |
          $bump = $env:MANUAL_BUMP

          if ('${{ github.event_name }}' -eq 'pull_request') {
            $currentVersion = node -p "require('./frontend/package.json').version"
            gh release view "v$currentVersion" --repo '${{ github.repository }}' *> $null
            $bump = if ($LASTEXITCODE -eq 0) { 'patch' } else { 'none' }
          }

          Push-Location frontend
          if ($bump -ne 'none') {
            npm version $bump --no-git-tag-version
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          npm run version:sync
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location

          $version = node -p "require('./frontend/package.json').version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          gh release view "v$version" --repo '${{ github.repository }}' *> $null
          if ($LASTEXITCODE -eq 0) {
            "published=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Version $version is already published; nothing to do."
          } else {
            "published=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Preparing version $version with bump mode $bump."
          }
          exit 0

      - name: Set up Python
        if: steps.version.outputs.published != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        if: steps.version.outputs.published != 'true'
        run: python -m pip install -r requirements.txt

      - name: Test backend
        if: steps.version.outputs.published != 'true'
        run: python -m unittest discover -s tests

      - name: Install frontend dependencies
        if: steps.version.outputs.published != 'true'
        working-directory: frontend
        run: npm ci

      - name: Test frontend
        if: steps.version.outputs.published != 'true'
        working-directory: frontend
        run: npm test

      - name: Type-check frontend
        if: steps.version.outputs.published != 'true'
        working-directory: frontend
        run: npm run typecheck

      - name: Lint frontend
        if: steps.version.outputs.published != 'true'
        working-directory: frontend
        run: npm run lint

      - name: Build and smoke-test Electron
        if: steps.version.outputs.published != 'true'
        working-directory: frontend
        run: npm run smoke

      - name: Build and audit Windows installer
        if: steps.version.outputs.published != 'true'
        working-directory: frontend
        run: npm run package:win

      - name: Smoke-test packaged application
        if: steps.version.outputs.published != 'true'
        working-directory: frontend
        run: npm run smoke:package

      - name: Commit synchronized version
        if: steps.version.outputs.published != 'true'
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/package.json frontend/package-lock.json frontend/src/features/settings/SettingsPage.tsx README.md docs/index.html
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "chore(release): v${{ steps.version.outputs.version }}"
            git push origin HEAD:main
          }

      - name: Tag release
        if: steps.version.outputs.published != 'true'
        shell: pwsh
        run: |
          $tag = 'v${{ steps.version.outputs.version }}'
          git fetch --tags origin
          if (-not (git tag --list $tag)) {
            git tag -a $tag -m "Expletive Deleted $tag"
            git push origin $tag
          }

      - name: Publish GitHub Release
        if: steps.version.outputs.published != 'true'
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $installer = "frontend/release/Expletive-Deleted-Setup-$version-x64.exe"
          if (-not (Test-Path $installer)) { throw "Installer was not created: $installer" }
          gh release create "v$version" $installer --verify-tag --generate-notes --title "Expletive Deleted $version"
