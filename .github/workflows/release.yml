name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment for a manual release
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - none

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Version, validate, and publish
    outputs:
      version: ${{ steps.version.outputs.version }}
      published: ${{ steps.version.outputs.published }}
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      HF_HUB_OFFLINE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Choose release version
        id: version
        shell: pwsh
        env:
          MANUAL_BUMP: ${{ inputs.bump }}
        run: |
          $packageVersion = node -p "require('./frontend/package.json').version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $releaseTagsJson = gh release list --exclude-drafts --exclude-pre-releases --limit 100 --repo '${{ github.repository }}' --json tagName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $releaseTags = @($releaseTagsJson | ConvertFrom-Json | ForEach-Object { $_.tagName })
          $latestTag = $releaseTags | Select-Object -First 1
          $hasPublishedRelease = -not [string]::IsNullOrWhiteSpace($latestTag)

          if ($hasPublishedRelease) {
            $latestVersion = $latestTag.TrimStart('v')
            $bump = if ('${{ github.event_name }}' -eq 'push') { 'patch' } else { $env:MANUAL_BUMP }

            if ('${{ github.event_name }}' -eq 'push' -and [version]$packageVersion -gt [version]$latestVersion) {
              $version = $packageVersion
            } elseif ($bump -eq 'none') {
              $version = $packageVersion
            } else {
              $parts = $latestVersion.Split('.') | ForEach-Object { [int]$_ }
              switch ($bump) {
                'major' { $version = "$(1 + $parts[0]).0.0" }
                'minor' { $version = "$($parts[0]).$(1 + $parts[1]).0" }
                'patch' { $version = "$($parts[0]).$($parts[1]).$(1 + $parts[2])" }
                default { throw "Unsupported version bump: $bump" }
              }
            }
          } else {
            $version = $packageVersion
          }

          Push-Location frontend
          npm version $version --no-git-tag-version --allow-same-version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run version:sync
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          if ($releaseTags -contains "v$version") {
            "published=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Version $version is already published; nothing to do."
          } else {
            "published=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Preparing version $version. Version metadata changes remain local to this build."
          }
          exit 0

      - name: Set up Python
        if: steps.version.outputs.published != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Prepare private Python runtime
        if: steps.version.outputs.published != 'true'
        shell: pwsh
        run: |
          $source = (python -c "import sys; print(sys.prefix)").Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $destination = Join-Path $env:RUNNER_TEMP 'private-python'
          if (Test-Path -LiteralPath $destination) { Remove-Item -LiteralPath $destination -Recurse -Force }
          Copy-Item -LiteralPath $source -Destination $destination -Recurse
          $copiedPrefix = (& (Join-Path $destination 'python.exe') -I -c "import sys; print(sys.prefix)").Trim()
          if ($LASTEXITCODE -ne 0 -or [IO.Path]::GetFullPath($copiedPrefix) -ne [IO.Path]::GetFullPath($destination)) {
            throw "The copied Python runtime is not relocatable: $copiedPrefix"
          }
          "PRIVATE_PYTHON_DIR=$destination" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install backend dependencies
        if: steps.version.outputs.published != 'true'
        run: python -m pip install -r requirements.txt

      - name: Test backend
        if: steps.version.outputs.published != 'true'
        run: python -m unittest discover -s tests

      - name: Install frontend dependencies
        if: steps.version.outputs.published != 'true'
        working-directory: frontend
        run: npm ci

      - name: Test frontend
        if: steps.version.outputs.published != 'true'
        working-directory: frontend
        run: npm test

      - name: Type-check frontend
        if: steps.version.outputs.published != 'true'
        working-directory: frontend
        run: npm run typecheck

      - name: Lint frontend
        if: steps.version.outputs.published != 'true'
        working-directory: frontend
        run: npm run lint

      - name: Build and smoke-test Electron
        if: steps.version.outputs.published != 'true'
        working-directory: frontend
        run: npm run smoke

      - name: Set up LGPL runtime build tools
        if: steps.version.outputs.published != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          install: >-
            base-devel
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-pkgconf

      - name: Build LGPL-only FFmpeg
        if: steps.version.outputs.published != 'true'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          runner_temp="$(cygpath -u "$RUNNER_TEMP")"
          archive="$runner_temp/ffmpeg-8.1.2.tar.xz"
          source_root="$runner_temp/ffmpeg-source"
          prefix="$runner_temp/ffmpeg-lgpl"
          curl -L --fail --retry 3 -o "$archive" https://ffmpeg.org/releases/ffmpeg-8.1.2.tar.xz
          echo "464beb5e7bf0c311e68b45ae2f04e9cc2af88851abb4082231742a74d97b524c  $archive" | sha256sum --check
          rm -rf "$source_root" "$prefix"
          mkdir -p "$source_root" "$prefix"
          tar -xf "$archive" -C "$source_root" --strip-components=1
          cd "$source_root"
          ./configure \
            --prefix="$prefix" \
            --disable-static \
            --enable-shared \
            --disable-doc \
            --disable-debug \
            --disable-gpl \
            --disable-nonfree \
            --disable-autodetect
          make -j2
          make install

      - name: Assemble and audit bundled runtime
        if: steps.version.outputs.published != 'true'
        working-directory: frontend
        shell: pwsh
        run: |
          ./scripts/build-audited-runtime.ps1 `
            -PythonRuntimeDirectory $env:PRIVATE_PYTHON_DIR `
            -FfmpegPrefix (Join-Path $env:RUNNER_TEMP 'ffmpeg-lgpl') `
            -FfmpegSourceDirectory (Join-Path $env:RUNNER_TEMP 'ffmpeg-source') `
            -OutputDirectory (Join-Path $env:RUNNER_TEMP 'audited-runtime')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "BUNDLED_RUNTIME_DIR=$(Join-Path $env:RUNNER_TEMP 'audited-runtime')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build and audit setup-first Windows installer
        if: steps.version.outputs.published != 'true'
        working-directory: frontend
        env:
          REQUIRE_BUNDLED_RUNTIME: "1"
        shell: pwsh
        run: |
          npm run package:win

      - name: Smoke-test packaged application
        if: steps.version.outputs.published != 'true'
        working-directory: frontend
        run: npm run smoke:setup-first-package

      - name: Tag release
        if: steps.version.outputs.published != 'true'
        shell: pwsh
        run: |
          $tag = 'v${{ steps.version.outputs.version }}'
          git config user.name 'github-actions[bot]'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git add frontend/package.json frontend/package-lock.json frontend/src/features/settings/SettingsPage.tsx README.md docs/index.html
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git fetch --tags origin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $releaseTree = git write-tree
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (git tag --list $tag) {
            $taggedTree = git rev-parse "$tag^{tree}"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ($taggedTree -ne $releaseTree) {
              throw "Existing tag $tag does not match the validated release source."
            }
            Write-Host "Using existing matching tag $tag."
            exit 0
          }

          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "chore(release): $tag"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          git tag -a $tag -m "Expletive Deleted $tag"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin $tag
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish GitHub Release
        if: steps.version.outputs.published != 'true'
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $installer = "frontend/release/Expletive-Deleted-Setup-$version-x64.exe"
          if (-not (Test-Path $installer)) { throw "Installer was not created: $installer" }
          gh release create "v$version" $installer --verify-tag --generate-notes --title "Expletive Deleted $version"

  deploy-product-site:
    name: Deploy released product site
    needs: release
    if: needs.release.outputs.published != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out released source
        uses: actions/checkout@v5
        with:
          ref: v${{ needs.release.outputs.version }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload product site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy product site
        id: deployment
        uses: actions/deploy-pages@v4
