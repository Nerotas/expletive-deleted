name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment for a manual release
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - none

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Version, validate, and publish
    outputs:
      version: ${{ steps.version.outputs.version }}
      published: ${{ steps.version.outputs.published }}
      previous_tag: ${{ steps.version.outputs.previous_tag }}
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      HF_HUB_OFFLINE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Choose release version
        id: version
        shell: pwsh
        env:
          MANUAL_BUMP: ${{ inputs.bump }}
        run: |
          $packageVersion = node -p "require('./frontend/package.json').version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $releaseTagsJson = gh release list --exclude-drafts --exclude-pre-releases --limit 100 --repo '${{ github.repository }}' --json tagName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $releaseTags = @($releaseTagsJson | ConvertFrom-Json | ForEach-Object { $_.tagName })

          $stableReleases = @(
            $releaseTags |
              Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } |
              ForEach-Object {
                [PSCustomObject]@{
                  Tag = $_
                  Version = [version]$_.Substring(1)
                }
              }
          )
          $previousRelease = $stableReleases | Sort-Object Version -Descending | Select-Object -First 1

          if ($null -ne $previousRelease) {
            $parts = $previousRelease.Version.ToString().Split('.') | ForEach-Object { [int]$_ }
            switch ($env:MANUAL_BUMP) {
              'major' { $version = "$(1 + $parts[0]).0.0" }
              'minor' { $version = "$($parts[0]).$(1 + $parts[1]).0" }
              'patch' { $version = "$($parts[0]).$($parts[1]).$(1 + $parts[2])" }
              'none' { $version = $packageVersion }
              default { throw "Unsupported version bump: $env:MANUAL_BUMP" }
            }
          } else {
            $version = $packageVersion
          }

          Push-Location frontend
          npm version $version --no-git-tag-version --allow-same-version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run version:sync
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "previous_tag=$($previousRelease.Tag)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          if ($releaseTags -contains "v$version") {
            "published=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Version $version is already published; nothing to do."
          } else {
            "published=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Preparing version $version. Version metadata changes remain local to this build."
          }
          exit 0

      - name: Set up Python
        if: steps.version.outputs.published != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Prepare private Python runtime
        if: steps.version.outputs.published != 'true'
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip==25.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $source = (python -c "import sys; print(sys.prefix)").Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $destination = Join-Path $env:RUNNER_TEMP 'private-python'
          if (Test-Path -LiteralPath $destination) { Remove-Item -LiteralPath $destination -Recurse -Force }
          Copy-Item -LiteralPath $source -Destination $destination -Recurse
          $copiedPrefix = (& (Join-Path $destination 'python.exe') -I -c "import sys; print(sys.prefix)").Trim()
          if ($LASTEXITCODE -ne 0 -or [IO.Path]::GetFullPath($copiedPrefix) -ne [IO.Path]::GetFullPath($destination)) {
            throw "The copied Python runtime is not relocatable: $copiedPrefix"
          }
          "PRIVATE_PYTHON_DIR=$destination" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install backend dependencies
        if: steps.version.outputs.published != 'true'
        run: python -m pip install -r requirements.txt

      - name: Test backend
        if: steps.version.outputs.published != 'true'
        run: python -m unittest discover -s tests

      - name: Install frontend dependencies
        if: steps.version.outputs.published != 'true'
        working-directory: frontend
        run: npm ci

      - name: Test frontend
        if: steps.version.outputs.published != 'true'
        working-directory: frontend
        run: npm test

      - name: Type-check frontend
        if: steps.version.outputs.published != 'true'
        working-directory: frontend
        run: npm run typecheck

      - name: Lint frontend
        if: steps.version.outputs.published != 'true'
        working-directory: frontend
        run: npm run lint

      - name: Build and smoke-test Electron
        if: steps.version.outputs.published != 'true'
        working-directory: frontend
        run: npm run smoke

      - name: Verify filesystem safety under private release Python
        if: steps.version.outputs.published != 'true'
        shell: pwsh
        run: |
          & (Join-Path $env:PRIVATE_PYTHON_DIR 'python.exe') -B -m unittest tests.test_filesystem_paths tests.test_windows_destination_guards tests.test_publication tests.test_output_access tests.test_policy_transactions
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check renderer security in production and Vite development
        if: steps.version.outputs.published != 'true'
        working-directory: frontend
        run: npm run smoke:security

      - name: Verify native playback and dictionary file authorization
        if: steps.version.outputs.published != 'true'
        working-directory: frontend
        run: npm run smoke:native-files

      - name: Verify desktop ownership, onboarding and component conflicts, and concurrent CLI edits
        if: steps.version.outputs.published != 'true'
        working-directory: frontend
        run: npm run smoke:state

      - name: Verify setup reconnection, silence, exit, and worker saturation
        if: steps.version.outputs.published != 'true'
        working-directory: frontend
        run: npm run smoke:recovery

      - name: Smoke-test graceful and forced shutdown
        if: steps.version.outputs.published != 'true'
        working-directory: frontend
        run: node scripts/smoke-shutdown.mjs

      - name: Assemble and audit private Python runtime
        if: steps.version.outputs.published != 'true'
        working-directory: frontend
        shell: pwsh
        run: |
          ./scripts/build-audited-runtime.ps1 `
            -PythonRuntimeDirectory $env:PRIVATE_PYTHON_DIR `
            -OutputDirectory (Join-Path $env:RUNNER_TEMP 'audited-runtime')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "BUNDLED_RUNTIME_DIR=$(Join-Path $env:RUNNER_TEMP 'audited-runtime')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build and audit setup-first Windows installer
        if: steps.version.outputs.published != 'true'
        working-directory: frontend
        env:
          REQUIRE_BUNDLED_RUNTIME: "1"
        shell: pwsh
        run: |
          npm run package:win

      - name: Smoke-test packaged application
        if: steps.version.outputs.published != 'true'
        working-directory: frontend
        run: npm run smoke:setup-first-package

      - name: Tag release
        if: steps.version.outputs.published != 'true'
        shell: pwsh
        run: |
          $tag = 'v${{ steps.version.outputs.version }}'
          git config user.name 'github-actions[bot]'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git add frontend/package.json frontend/package-lock.json frontend/src/features/settings/SettingsPage.tsx README.md docs/index.html
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git fetch --tags origin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $releaseTree = git write-tree
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (git tag --list $tag) {
            $taggedTree = git rev-parse "$tag^{tree}"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ($taggedTree -ne $releaseTree) {
              throw "Existing tag $tag does not match the validated release source."
            }
            Write-Host "Using existing matching tag $tag."
            exit 0
          }

          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "chore(release): $tag"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          git tag -a $tag -m "Expletive Deleted $tag"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin $tag
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish GitHub Release
        if: steps.version.outputs.published != 'true'
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $previousTag = '${{ steps.version.outputs.previous_tag }}'
          $installer = "frontend/release/Expletive-Deleted-Setup-$version-x64.exe"
          if (-not (Test-Path $installer)) { throw "Installer was not created: $installer" }
          $notesArguments = @('--generate-notes')
          if (-not [string]::IsNullOrWhiteSpace($previousTag)) {
            # Older release tags may be sibling commits, so select the baseline explicitly.
            $notesArguments += @('--notes-start-tag', $previousTag)
          }
          gh release create "v$version" $installer --verify-tag @notesArguments --title "Expletive Deleted $version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  deploy-product-site:
    name: Deploy released product site
    needs: release
    if: needs.release.outputs.published != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out released source
        uses: actions/checkout@v5
        with:
          ref: v${{ needs.release.outputs.version }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload product site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy product site
        id: deployment
        uses: actions/deploy-pages@v4
