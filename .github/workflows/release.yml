name: Release

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "resources/**"
      - "scripts/**"
      - "*.py"
      - "requirements.txt"
      - "config.example.ini"
      - "convert-profanity-censor.ps1"
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment for a manual release
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - none

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Version, validate, and publish
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      HF_HUB_OFFLINE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Choose release version
        id: version
        shell: pwsh
        env:
          MANUAL_BUMP: ${{ inputs.bump }}
        run: |
          $packageVersion = node -p "require('./frontend/package.json').version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $latestTag = gh release view --repo '${{ github.repository }}' --json tagName --jq '.tagName' 2>$null
          $hasPublishedRelease = $LASTEXITCODE -eq 0

          if ($hasPublishedRelease) {
            $latestVersion = $latestTag.TrimStart('v')
            $bump = if ('${{ github.event_name }}' -eq 'push') { 'patch' } else { $env:MANUAL_BUMP }

            if ('${{ github.event_name }}' -eq 'push' -and [version]$packageVersion -gt [version]$latestVersion) {
              $version = $packageVersion
            } elseif ($bump -eq 'none') {
              $version = $packageVersion
            } else {
              $parts = $latestVersion.Split('.') | ForEach-Object { [int]$_ }
              switch ($bump) {
                'major' { $version = "$(1 + $parts[0]).0.0" }
                'minor' { $version = "$($parts[0]).$(1 + $parts[1]).0" }
                'patch' { $version = "$($parts[0]).$($parts[1]).$(1 + $parts[2])" }
                default { throw "Unsupported version bump: $bump" }
              }
            }
          } else {
            $version = $packageVersion
          }

          Push-Location frontend
          npm version $version --no-git-tag-version --allow-same-version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run version:sync
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          gh release view "v$version" --repo '${{ github.repository }}' *> $null
          if ($LASTEXITCODE -eq 0) {
            "published=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Version $version is already published; nothing to do."
          } else {
            "published=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Preparing version $version. Version metadata changes remain local to this build."
          }
          exit 0

      - name: Set up Python
        if: steps.version.outputs.published != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        if: steps.version.outputs.published != 'true'
        run: python -m pip install -r requirements.txt

      - name: Test backend
        if: steps.version.outputs.published != 'true'
        run: python -m unittest discover -s tests

      - name: Install frontend dependencies
        if: steps.version.outputs.published != 'true'
        working-directory: frontend
        run: npm ci

      - name: Test frontend
        if: steps.version.outputs.published != 'true'
        working-directory: frontend
        run: npm test

      - name: Type-check frontend
        if: steps.version.outputs.published != 'true'
        working-directory: frontend
        run: npm run typecheck

      - name: Lint frontend
        if: steps.version.outputs.published != 'true'
        working-directory: frontend
        run: npm run lint

      - name: Build and smoke-test Electron
        if: steps.version.outputs.published != 'true'
        working-directory: frontend
        run: npm run smoke

      - name: Build and audit Windows installer
        if: steps.version.outputs.published != 'true'
        working-directory: frontend
        run: npm run package:win

      - name: Smoke-test packaged application
        if: steps.version.outputs.published != 'true'
        working-directory: frontend
        run: npm run smoke:package

      - name: Tag release
        if: steps.version.outputs.published != 'true'
        shell: pwsh
        run: |
          $tag = 'v${{ steps.version.outputs.version }}'
          git fetch --tags origin
          if (-not (git tag --list $tag)) {
            git tag -a $tag -m "Expletive Deleted $tag"
            git push origin $tag
          }

      - name: Publish GitHub Release
        if: steps.version.outputs.published != 'true'
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $installer = "frontend/release/Expletive-Deleted-Setup-$version-x64.exe"
          if (-not (Test-Path $installer)) { throw "Installer was not created: $installer" }
          gh release create "v$version" $installer --verify-tag --generate-notes --title "Expletive Deleted $version"
