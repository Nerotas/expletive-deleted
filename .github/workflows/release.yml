name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment for a manual release
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - none
      runtime_build_run_id:
        description: GitHub Actions run ID that produced the audited runtime artifact
        required: true
        type: string
      runtime_artifact_name:
        description: Exact artifact name produced by the runtime-build workflow
        required: true
        type: string

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Version, validate, and publish
    outputs:
      version: ${{ steps.version.outputs.version }}
      published: ${{ steps.version.outputs.published }}
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      HF_HUB_OFFLINE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Choose release version
        id: version
        shell: pwsh
        env:
          MANUAL_BUMP: ${{ inputs.bump }}
        run: |
          $packageVersion = node -p "require('./frontend/package.json').version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $releaseTagsJson = gh release list --exclude-drafts --exclude-pre-releases --limit 100 --repo '${{ github.repository }}' --json tagName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $releaseTags = @($releaseTagsJson | ConvertFrom-Json | ForEach-Object { $_.tagName })
          $latestTag = $releaseTags | Select-Object -First 1
          $hasPublishedRelease = -not [string]::IsNullOrWhiteSpace($latestTag)

          if ($hasPublishedRelease) {
            $latestVersion = $latestTag.TrimStart('v')
            $bump = if ('${{ github.event_name }}' -eq 'push') { 'patch' } else { $env:MANUAL_BUMP }

            if ('${{ github.event_name }}' -eq 'push' -and [version]$packageVersion -gt [version]$latestVersion) {
              $version = $packageVersion
            } elseif ($bump -eq 'none') {
              $version = $packageVersion
            } else {
              $parts = $latestVersion.Split('.') | ForEach-Object { [int]$_ }
              switch ($bump) {
                'major' { $version = "$(1 + $parts[0]).0.0" }
                'minor' { $version = "$($parts[0]).$(1 + $parts[1]).0" }
                'patch' { $version = "$($parts[0]).$($parts[1]).$(1 + $parts[2])" }
                default { throw "Unsupported version bump: $bump" }
              }
            }
          } else {
            $version = $packageVersion
          }

          Push-Location frontend
          npm version $version --no-git-tag-version --allow-same-version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run version:sync
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          if ($releaseTags -contains "v$version") {
            "published=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Version $version is already published; nothing to do."
          } else {
            "published=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Preparing version $version. Version metadata changes remain local to this build."
          }
          exit 0

      - name: Set up Python
        if: steps.version.outputs.published != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        if: steps.version.outputs.published != 'true'
        run: python -m pip install -r requirements.txt

      - name: Test backend
        if: steps.version.outputs.published != 'true'
        run: python -m unittest discover -s tests

      - name: Install frontend dependencies
        if: steps.version.outputs.published != 'true'
        working-directory: frontend
        run: npm ci

      - name: Test frontend
        if: steps.version.outputs.published != 'true'
        working-directory: frontend
        run: npm test

      - name: Type-check frontend
        if: steps.version.outputs.published != 'true'
        working-directory: frontend
        run: npm run typecheck

      - name: Lint frontend
        if: steps.version.outputs.published != 'true'
        working-directory: frontend
        run: npm run lint

      - name: Build and smoke-test Electron
        if: steps.version.outputs.published != 'true'
        working-directory: frontend
        run: npm run smoke

      - name: Download audited runtime artifact
        if: steps.version.outputs.published != 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.runtime_artifact_name }}
          path: ${{ runner.temp }}\audited-runtime-artifact
          repository: ${{ github.repository }}
          run-id: ${{ inputs.runtime_build_run_id }}
          github-token: ${{ github.token }}

      - name: Build and audit Windows installer
        if: steps.version.outputs.published != 'true'
        working-directory: frontend
        env:
          RUNTIME_ARTIFACT_ROOT: ${{ runner.temp }}\audited-runtime-artifact
        shell: pwsh
        run: |
          $metadataPath = Join-Path $env:RUNTIME_ARTIFACT_ROOT 'runtime-bundle.json'
          $metadata = Get-Content -LiteralPath $metadataPath -Raw | ConvertFrom-Json
          if ($metadata.runtime_version -eq $null -or $metadata.archive_sha256 -notmatch '^[0-9a-fA-F]{64}$') {
            throw 'The runtime artifact metadata is missing a runtime version or valid archive SHA-256.'
          }
          $archive = Join-Path $env:RUNTIME_ARTIFACT_ROOT $metadata.archive_name
          if (-not (Test-Path -LiteralPath $archive)) {
            throw "The runtime artifact archive is missing: $($metadata.archive_name)"
          }
          $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          if ($actualHash -ine $metadata.archive_sha256) {
            throw "Audited runtime archive checksum mismatch. Expected $($metadata.archive_sha256), got $actualHash."
          }
          $runtimeDirectory = Join-Path $env:RUNNER_TEMP 'audited-runtime'
          Expand-Archive -LiteralPath $archive -DestinationPath $runtimeDirectory -Force
          $payload = Get-ChildItem -LiteralPath $runtimeDirectory -Directory | Select-Object -First 1
          if (-not $payload) { $payload = Get-Item -LiteralPath $runtimeDirectory }
          "BUNDLED_RUNTIME_DIR=$($payload.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          npm run package:bundled-win

      - name: Smoke-test packaged application
        if: steps.version.outputs.published != 'true'
        working-directory: frontend
        run: npm run smoke:bundled-package

      - name: Tag release
        if: steps.version.outputs.published != 'true'
        shell: pwsh
        run: |
          $tag = 'v${{ steps.version.outputs.version }}'
          git config user.name 'github-actions[bot]'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git add frontend/package.json frontend/package-lock.json frontend/src/features/settings/SettingsPage.tsx README.md docs/index.html
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git fetch --tags origin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $releaseTree = git write-tree
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (git tag --list $tag) {
            $taggedTree = git rev-parse "$tag^{tree}"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ($taggedTree -ne $releaseTree) {
              throw "Existing tag $tag does not match the validated release source."
            }
            Write-Host "Using existing matching tag $tag."
            exit 0
          }

          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "chore(release): $tag"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          git tag -a $tag -m "Expletive Deleted $tag"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin $tag
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish GitHub Release
        if: steps.version.outputs.published != 'true'
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $installer = "frontend/release/Expletive-Deleted-Setup-$version-x64.exe"
          if (-not (Test-Path $installer)) { throw "Installer was not created: $installer" }
          gh release create "v$version" $installer --verify-tag --generate-notes --title "Expletive Deleted $version"

  deploy-product-site:
    name: Deploy released product site
    needs: release
    if: needs.release.outputs.published != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out released source
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload product site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy product site
        id: deployment
        uses: actions/deploy-pages@v4
