name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment for a manual release
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - none

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Version, validate, and publish
    outputs:
      version: ${{ steps.version.outputs.version }}
      published: ${{ steps.version.outputs.published }}
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      HF_HUB_OFFLINE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Choose release version
        id: version
        shell: pwsh
        env:
          MANUAL_BUMP: ${{ inputs.bump }}
        run: |
          $packageVersion = node -p "require('./frontend/package.json').version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $releaseTagsJson = gh release list --exclude-drafts --exclude-pre-releases --limit 100 --repo '${{ github.repository }}' --json tagName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $releaseTags = @($releaseTagsJson | ConvertFrom-Json | ForEach-Object { $_.tagName })
          $latestTag = $releaseTags | Select-Object -First 1
          $hasPublishedRelease = -not [string]::IsNullOrWhiteSpace($latestTag)

          if ($hasPublishedRelease) {
            $latestVersion = $latestTag.TrimStart('v')
            $bump = if ('${{ github.event_name }}' -eq 'push') { 'patch' } else { $env:MANUAL_BUMP }

            if ('${{ github.event_name }}' -eq 'push' -and [version]$packageVersion -gt [version]$latestVersion) {
              $version = $packageVersion
            } elseif ($bump -eq 'none') {
              $version = $packageVersion
            } else {
              $parts = $latestVersion.Split('.') | ForEach-Object { [int]$_ }
              switch ($bump) {
                'major' { $version = "$(1 + $parts[0]).0.0" }
                'minor' { $version = "$($parts[0]).$(1 + $parts[1]).0" }
                'patch' { $version = "$($parts[0]).$($parts[1]).$(1 + $parts[2])" }
                default { throw "Unsupported version bump: $bump" }
              }
            }
          } else {
            $version = $packageVersion
          }

          Push-Location frontend
          npm version $version --no-git-tag-version --allow-same-version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run version:sync
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          if ($releaseTags -contains "v$version") {
            "published=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Version $version is already published; nothing to do."
          } else {
            "published=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Preparing version $version. Version metadata changes remain local to this build."
          }
          exit 0

      - name: Set up Python
        if: steps.version.outputs.published != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        if: steps.version.outputs.published != 'true'
        run: python -m pip install -r requirements.txt

      - name: Test backend
        if: steps.version.outputs.published != 'true'
        run: python -m unittest discover -s tests

      - name: Install frontend dependencies
        if: steps.version.outputs.published != 'true'
        working-directory: frontend
        run: npm ci

      - name: Test frontend
        if: steps.version.outputs.published != 'true'
        working-directory: frontend
        run: npm test

      - name: Type-check frontend
        if: steps.version.outputs.published != 'true'
        working-directory: frontend
        run: npm run typecheck

      - name: Lint frontend
        if: steps.version.outputs.published != 'true'
        working-directory: frontend
        run: npm run lint

      - name: Build and smoke-test Electron
        if: steps.version.outputs.published != 'true'
        working-directory: frontend
        run: npm run smoke

      - name: Resolve bundled runtime inputs
        if: steps.version.outputs.published != 'true'
        shell: pwsh
        env:
          BUNDLED_RUNTIME_DIR: ${{ vars.BUNDLED_RUNTIME_DIR || secrets.BUNDLED_RUNTIME_DIR }}
          BUNDLED_RUNTIME_ARCHIVE_URL: ${{ vars.BUNDLED_RUNTIME_ARCHIVE_URL || secrets.BUNDLED_RUNTIME_ARCHIVE_URL }}
          BUNDLED_RUNTIME_ARCHIVE_SHA256: ${{ vars.BUNDLED_RUNTIME_ARCHIVE_SHA256 || secrets.BUNDLED_RUNTIME_ARCHIVE_SHA256 }}
          BUNDLED_PYTHON_DIR: ${{ vars.BUNDLED_PYTHON_DIR || secrets.BUNDLED_PYTHON_DIR }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          function Normalize-InputPath([string]$Value) {
            $trimmed = "$Value".Trim()
            if ([string]::IsNullOrWhiteSpace($trimmed)) { return '' }
            if ($trimmed -match '^\$env:') {
              throw "Bundled runtime path values must be concrete absolute paths, not literal PowerShell expressions: $trimmed"
            }
            return [Environment]::ExpandEnvironmentVariables($trimmed)
          }

          function Export-GithubEnv([string]$Name, [string]$Value) {
            "$Name=$Value" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

          $runtimeDir = Normalize-InputPath $env:BUNDLED_RUNTIME_DIR
          $pythonDir = Normalize-InputPath $env:BUNDLED_PYTHON_DIR
          $archiveUrl = "$env:BUNDLED_RUNTIME_ARCHIVE_URL".Trim()
          $archiveSha = "$env:BUNDLED_RUNTIME_ARCHIVE_SHA256".Trim()

          if ([string]::IsNullOrWhiteSpace($runtimeDir) -and -not [string]::IsNullOrWhiteSpace($archiveUrl)) {
            $archivePath = Join-Path $env:RUNNER_TEMP 'bundled-runtime.zip'
            $extractRoot = Join-Path $env:RUNNER_TEMP 'bundled-runtime'
            if (Test-Path -LiteralPath $archivePath) { Remove-Item -LiteralPath $archivePath -Force }
            if (Test-Path -LiteralPath $extractRoot) { Remove-Item -LiteralPath $extractRoot -Recurse -Force }

            Invoke-WebRequest -Uri $archiveUrl -OutFile $archivePath
            if (-not (Test-Path -LiteralPath $archivePath)) {
              throw 'Bundled runtime archive download did not create a file.'
            }

            if (-not [string]::IsNullOrWhiteSpace($archiveSha)) {
              $actualSha = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($actualSha -ne $archiveSha.ToLowerInvariant()) {
                throw "Bundled runtime archive SHA-256 mismatch. Expected $archiveSha, got $actualSha"
              }
            }

            Expand-Archive -LiteralPath $archivePath -DestinationPath $extractRoot -Force
            $manifestAtRoot = Join-Path $extractRoot 'runtime-manifest.json'
            if (Test-Path -LiteralPath $manifestAtRoot) {
              $runtimeDir = $extractRoot
            } else {
              $candidates = @(Get-ChildItem -LiteralPath $extractRoot -Directory | Where-Object {
                Test-Path -LiteralPath (Join-Path $_.FullName 'runtime-manifest.json')
              })
              if ($candidates.Count -eq 1) {
                $runtimeDir = $candidates[0].FullName
              } else {
                throw 'Bundled runtime archive must contain runtime-manifest.json at root or in exactly one top-level folder.'
              }
            }
          }

          if (-not [string]::IsNullOrWhiteSpace($runtimeDir)) {
            $runtimeDir = [IO.Path]::GetFullPath($runtimeDir)
            $runtimeManifest = Join-Path $runtimeDir 'runtime-manifest.json'
            $runtimePython = Join-Path $runtimeDir 'python'
            $runtimePythonExe = Join-Path $runtimePython 'python.exe'

            if (-not (Test-Path -LiteralPath $runtimeManifest)) {
              throw "BUNDLED_RUNTIME_DIR is missing runtime-manifest.json: $runtimeDir"
            }
            if (-not (Test-Path -LiteralPath $runtimePythonExe)) {
              throw "BUNDLED_RUNTIME_DIR is missing python/python.exe: $runtimeDir"
            }

            Export-GithubEnv 'BUNDLED_RUNTIME_DIR' $runtimeDir
            Export-GithubEnv 'BUNDLED_PYTHON_DIR' $runtimePython
            Write-Host "Bundled runtime resolved: $runtimeDir"
            exit 0
          }

          if ([string]::IsNullOrWhiteSpace($pythonDir)) {
            throw 'Bundled runtime is not configured. Set BUNDLED_RUNTIME_DIR, or set BUNDLED_RUNTIME_ARCHIVE_URL (optionally BUNDLED_RUNTIME_ARCHIVE_SHA256), or set BUNDLED_PYTHON_DIR.'
          }

          $pythonDir = [IO.Path]::GetFullPath($pythonDir)
          $pythonExe = Join-Path $pythonDir 'python.exe'
          if (-not (Test-Path -LiteralPath $pythonExe)) {
            throw "BUNDLED_PYTHON_DIR is missing python.exe: $pythonDir"
          }
          Export-GithubEnv 'BUNDLED_PYTHON_DIR' $pythonDir
          Write-Host "Bundled Python runtime resolved: $pythonDir"

      - name: Build and audit setup-first Windows installer
        if: steps.version.outputs.published != 'true'
        working-directory: frontend
        shell: pwsh
        run: |
          $bundledPythonDir = "$env:BUNDLED_PYTHON_DIR".Trim()
          if ([string]::IsNullOrWhiteSpace($bundledPythonDir)) {
            throw 'BUNDLED_PYTHON_DIR is not configured. Resolve bundled runtime inputs earlier in this workflow before packaging.'
          }
          if ($bundledPythonDir -match '^\$env:') {
            throw "BUNDLED_PYTHON_DIR must be a real absolute path, not a literal PowerShell expression: $bundledPythonDir"
          }
          $pythonExe = Join-Path -Path $bundledPythonDir -ChildPath 'python.exe'
          if (-not (Test-Path -LiteralPath $pythonExe)) {
            throw "BUNDLED_PYTHON_DIR is missing python.exe: $bundledPythonDir"
          }
          npm run package:win

      - name: Smoke-test packaged application
        if: steps.version.outputs.published != 'true'
        working-directory: frontend
        run: npm run smoke:package

      - name: Tag release
        if: steps.version.outputs.published != 'true'
        shell: pwsh
        run: |
          $tag = 'v${{ steps.version.outputs.version }}'
          git config user.name 'github-actions[bot]'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git add frontend/package.json frontend/package-lock.json frontend/src/features/settings/SettingsPage.tsx README.md docs/index.html
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git fetch --tags origin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $releaseTree = git write-tree
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (git tag --list $tag) {
            $taggedTree = git rev-parse "$tag^{tree}"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ($taggedTree -ne $releaseTree) {
              throw "Existing tag $tag does not match the validated release source."
            }
            Write-Host "Using existing matching tag $tag."
            exit 0
          }

          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "chore(release): $tag"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          git tag -a $tag -m "Expletive Deleted $tag"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin $tag
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish GitHub Release
        if: steps.version.outputs.published != 'true'
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $installer = "frontend/release/Expletive-Deleted-Setup-$version-x64.exe"
          if (-not (Test-Path $installer)) { throw "Installer was not created: $installer" }
          gh release create "v$version" $installer --verify-tag --generate-notes --title "Expletive Deleted $version"

  deploy-product-site:
    name: Deploy released product site
    needs: release
    if: needs.release.outputs.published != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out released source
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload product site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy product site
        id: deployment
        uses: actions/deploy-pages@v4
