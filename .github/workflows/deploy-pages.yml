name: Redeploy product site

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to deploy, for example v1.0.14
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy released product site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out released source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload product site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy product site
        id: deployment
        uses: actions/deploy-pages@v4
